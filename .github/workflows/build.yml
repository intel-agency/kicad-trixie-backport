name: build

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Debian sid source version to rebuild (e.g. 10.0.6+dfsg-1)'
        required: true
        default: '10.0.6+dfsg-1'
      run_tests:
        description: 'Run the package test suite during the build'
        type: boolean
        default: true
      runner:
        description: 'runs-on label — ubuntu-latest, or a Blacksmith label (e.g. blacksmith-16vcpu-ubuntu-2404) once the Blacksmith app is installed on the org'
        required: true
        default: 'ubuntu-latest'

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.source_version }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild sid kicad for trixie and publish release
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330
    container:
      image: debian:trixie
    env:
      SOURCE_VERSION: ${{ inputs.source_version }}
      RUN_TESTS: ${{ inputs.run_tests }}
      POOL_BASE: https://deb.debian.org/debian/pool/main/k/kicad
      DEBFULLNAME: kicad-trixie-backport CI
      DEBEMAIL: nam20485@users.noreply.github.com
    steps:
      - name: Install build dependencies (trixie only — never sid)
        run: |
          set -euxo pipefail
          apt-get update -qq
          env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl jq xz-utils debian-keyring devscripts \
            chrpath cmake debhelper dh-python dpkg-dev gettext git imagemagick \
            libboost-date-time-dev libboost-dev libboost-filesystem-dev libboost-iostreams-dev \
            libboost-locale-dev libboost-program-options-dev libboost-regex-dev libboost-test-dev \
            libboost-thread-dev libbz2-dev libcairo2-dev libcurl4-openssl-dev libgit2-dev libglm-dev \
            libgtk-3-dev liblocale-gettext-perl libngspice0-dev libnng-dev libocct-data-exchange-dev \
            libpoppler-glib-dev libprotoc-dev libpython3-dev libsecret-1-dev libspnav-dev libssl-dev \
            libterm-readkey-perl libtext-wrapi18n-perl libunicode-linebreak-perl libwxgtk-webview3.2-dev \
            libwxgtk3.2-dev libxml2-utils pkgconf po4a protobuf-compiler python3-all python3-dev \
            python3-wxgtk4.0 source-highlight swig unixodbc-dev
          apt-get clean

      - name: Fetch the Debian sid source package
        run: |
          set -euxo pipefail
          curl -fsSLO "$POOL_BASE/kicad_${SOURCE_VERSION}.dsc"
          awk '$1 ~ /^[0-9a-f]{32}$/ {print $3}' "kicad_${SOURCE_VERSION}.dsc" \
            | while read -r f; do curl -fsSLO "$POOL_BASE/$f"; done
          ls -lh
          dpkg-source -x "kicad_${SOURCE_VERSION}.dsc" src

      - name: Re-version as a local trixie backport
        run: |
          set -euxo pipefail
          LOCAL_VERSION="$(printf '%s\n' "$SOURCE_VERSION" | sed -E 's/-[^-]+$/-0~local1/')"
          FUTURE_BPO="$(printf '%s\n' "$SOURCE_VERSION" | sed -E 's/-[^-]+$/-1~bpo13+1/')"
          cd src
          dch -b --newversion "$LOCAL_VERSION" --distribution trixie --force-distribution \
              "Rebuild Debian's kicad $SOURCE_VERSION on trixie (unofficial local backport)."
          cd ..
          printf 'LOCAL_VERSION=%s\n' "$LOCAL_VERSION" >> "$GITHUB_ENV"
          printf 'FUTURE_BPO=%s\n' "$FUTURE_BPO" >> "$GITHUB_ENV"
          # sanity: must exceed everything in trixie/trixie-backports…
          dpkg --compare-versions "$LOCAL_VERSION" gt 9.0.8~bpo13+1 \
            || { echo 'FAIL: local version does not exceed trixie-backports 9.0.8'; exit 1; }
          # …but stay below a future official same-upstream backport
          dpkg --compare-versions "$LOCAL_VERSION" lt "$FUTURE_BPO" \
            || { echo 'FAIL: local version would outrank an official backport'; exit 1; }

      - name: Build binary packages
        run: |
          set -euxo pipefail
          if [ "$RUN_TESTS" != "true" ]; then export DEB_BUILD_OPTIONS="nocheck"; fi
          cd src
          # -B: arch-dependent binaries only — arch:all packages come verbatim from sid,
          # and Build-Depends-Indep (the whole texlive/dblatex doc toolchain) is not needed
          dpkg-buildpackage -B -us -uc -j"$(nproc)"
          cd ..
          ls -lh ./*.deb

      - name: Collect arch:all data packages from sid
        run: |
          set -euxo pipefail
          # Temporary sid entry is used ONLY for `apt-get download` (fetch-only, nothing installed)
          echo 'deb http://deb.debian.org/debian sid main' > /etc/apt/sources.list.d/sid-tmp.list
          apt-get update -qq
          mkdir indep
          ( cd indep && apt-get download kicad-libraries kicad-symbols kicad-footprints kicad-templates kicad-demos )
          rm /etc/apt/sources.list.d/sid-tmp.list
          mv indep/*.deb .
          rmdir indep
          # dbgsym packages are huge and useless to release consumers — exclude
          ls ./*.deb | grep -v -- '-dbgsym_' | xargs sha256sum | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # git refs cannot contain '~' — sanitize only the tag; the .deb version keeps ~local1
          TAG="v${LOCAL_VERSION//\~/-}"
          SRC_URL="$POOL_BASE/kicad_${SOURCE_VERSION}.dsc"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          {
            echo "Unofficial KiCad backport for **Debian 13 (trixie) amd64**, rebuilt from Debian's own \`${SOURCE_VERSION}\` source package — no source modifications, only a changelog entry re-versioning the build."
            echo
            echo "## Install"
            echo
            echo 'Download all \`*.deb\` files and \`SHA256SUMS\`, then:'
            echo
            echo '```bash'
            echo "sudo apt install ./kicad_${LOCAL_VERSION}_amd64.deb ./kicad-libraries_*_all.deb ./kicad-symbols_*_all.deb ./kicad-footprints_*_all.deb ./kicad-templates_*_all.deb ./kicad-demos_*_all.deb"
            echo '```'
            echo
            echo '## Verify'
            echo
            echo '\`\`\`bash'
            echo 'sha256sum -c SHA256SUMS'
            echo '\`\`\`'
            echo
            echo "## Source"
            echo
            echo "- Debian source package: ${SRC_URL}"
            echo "- Build recipe: the [\`build.yml\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/.github/workflows/build.yml) workflow in this repo"
            echo
            echo "## Version policy"
            echo
            echo "\`${LOCAL_VERSION}\` sorts **below** a future official \`${FUTURE_BPO}\` backport, so Debian's own package supersedes this one automatically once published."
            echo
            echo "## Caveats"
            echo
            echo '- Unofficial — **not supported by Debian or KiCad**. Built from unmodified Debian sources.'
            echo '- The \`kicad\` binary package is rebuilt on trixie; the arch:all data packages are Debian sid'\''s own binaries, redistributed verbatim.'
            echo '- trixie amd64 only.'
            echo "- Tests: $RUN_TESTS"
          } > release-notes.md
          RELEASE_JSON=$(jq -n \
            --arg tag "$TAG" \
            --arg name "KiCad $LOCAL_VERSION for Debian trixie" \
            --arg body "$(cat release-notes.md)" \
            --arg sha "$GITHUB_SHA" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body}')
          # reuse the release if this tag was already published (e.g. after a re-run)
          RELEASE_ID=$(curl -fsS "$API/releases/tags/$TAG" | jq -r '.id // empty') || RELEASE_ID=""
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -fsS --fail-with-body -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "$RELEASE_JSON" | jq -r .id)
          fi
          for f in $(ls ./*.deb | grep -v -- '-dbgsym_') ./SHA256SUMS; do
            n=$(basename "$f" | jq -Rr @uri)
            curl -fsS --fail-with-body -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$n" \
              | jq -r .name
          done
          echo "Release published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
